<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>恩典第34屆沙龍聯展開幕禮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: url('201.jpg') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bottom-text {
            margin-top: 80px;
            font-size: clamp(18px, 4vw, 40px);
            font-weight: bold;
            letter-spacing: 2px;
            color: #8B0000;
        }

        @keyframes bottomGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 102, 204, 0.8), 0 0 40px rgba(0, 102, 204, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 102, 204, 1), 0 0 60px rgba(0, 102, 204, 0.7), inset 0 2px 10px rgba(255, 255, 255, 0.3); }
        }

        .main-title {
            font-size: clamp(24px, 6vw, 60px);
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
            white-space: nowrap;
            color: #8B0000;
        }

        .content-box {
            background: transparent;
            padding: 10px 0;
            margin-bottom: 0;
            border-radius: 0;
            border: none;
            box-shadow: none;
        }

        .content-box .text-p1 {
            font-size: 18px;
            line-height: 2.2;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffd700 0%, #ffec8b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .content-box .text-p2 {
            font-size: 18px;
            line-height: 2.2;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #98ff98 0%, #90ee90 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(152, 255, 152, 0.6);
        }

        .content-box .text-p3 {
            font-size: 18px;
            line-height: 2.2;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #87ceeb 0%, #b0e0e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(135, 206, 235, 0.6);
        }

        .content-box .text-p4 {
            font-size: 18px;
            line-height: 2.2;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
        }

        .content-box .text-p5 {
            font-size: 24px;
            line-height: 2.2;
            letter-spacing: 4px;
            margin-bottom: 0;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd700 0%, #ffec8b 30%, #ffd700 50%, #f5deb3 70%, #ffd700 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 20px rgba(255, 215, 0, 0.8),
                0 0 40px rgba(255, 215, 0, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: titleShine 3s ease infinite;
        }

        .video-section {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .video-section.active {
            display: flex;
        }

        video {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-container {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .magic-btn {
            position: relative;
            width: 320px;
            height: 320px;
            font-size: 30px;
            font-weight: bold;
            color: #fff;
            background: url('304.jpg') center/cover no-repeat;
            border: 5px solid #ffd700;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow:
                0 0 0 8px rgba(255, 215, 0, 0.3),
                0 0 0 12px rgba(255, 215, 0, 0.15),
                0 20px 40px rgba(0, 0, 0, 0.4),
                inset 0 -10px 20px rgba(0, 0, 0, 0.3),
                inset 0 10px 20px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .magic-btn::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
        }

        .btn-text {
            position: relative;
            z-index: 2;
            font-size: 30px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(255, 215, 0, 0.6);
        }

        .magic-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }

        .magic-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent 60%);
            border-radius: 50%;
        }

        .magic-btn:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow:
                0 20px 40px rgba(59, 130, 246, 0.4),
                0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .magic-btn:hover::before {
            opacity: 1;
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            0% { transform: rotate(45deg) translateX(-100%); }
            100% { transform: rotate(45deg) translateX(100%); }
        }

        .magic-btn:active {
            transform: translateY(3px) scale(0.95);
            box-shadow:
                0 5px 15px rgba(59, 130, 246, 0.3),
                0 2px 8px rgba(59, 130, 246, 0.2);
            transition: all 0.1s;
        }

        .btn-particles {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            animation: particleBurst 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .btn-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .magic-btn:active .btn-glow {
            width: 300px;
            height: 300px;
            animation: glowPulse 0.5s ease-out;
        }

        @keyframes glowPulse {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 400px; height: 400px; opacity: 0; }
        }

        .btn-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            border-radius: 50%;
        }

        .magic-btn:hover .btn-shine {
            animation: btnShine 0.8s ease;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        .video-overlay.active {
            display: flex;
        }

        .video-container {
            position: relative;
        }

        .video-overlay video {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .play-video-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: rgba(139, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
        }

        .close-video-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
        }

        .close-video-btn:hover {
            background: rgba(233, 69, 96, 0.8);
            transform: rotate(90deg);
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            animation: sparkleFloat 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0) rotate(180deg);
            }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
            z-index: 10;
        }

        .close-btn:hover {
            background: rgba(233, 69, 96, 0.8);
            transform: rotate(90deg);
        }

        .video-wrapper {
            position: relative;
            display: none;
        }

        .video-wrapper.active {
            display: inline-block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 15px;
            }

            .content-box {
                padding: 15px 10px;
            }

            .content-box p {
                font-size: 16px;
                line-height: 2;
                margin-bottom: 20px;
            }

            .content-box .text-p5 {
                font-size: 18px;
            }

            .magic-btn {
                width: 150px;
                height: 150px;
                font-size: 24px;
            }

            .btn-text {
                font-size: 22px;
            }

            .btn-container {
                margin-top: 30px;
            }

            .video-overlay video {
                max-width: 95%;
                max-height: 70vh;
            }

            .close-video-btn {
                top: 15px;
                right: 15px;
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
        }

        @media (max-width: 380px) {
            .magic-btn {
                width: 130px;
                height: 130px;
                font-size: 22px;
            }

            .btn-text {
                font-size: 20px;
            }

            .content-box p {
                font-size: 14px;
            }
        }

        @media (orientation: landscape) {
            body {
                padding: 15px;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .container {
                max-width: 100%;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .main-title {
                font-size: clamp(20px, 5vw, 40px);
                margin-bottom: 20px;
                white-space: nowrap;
                text-align: center;
            }

            .btn-container {
                margin-top: 10px;
            }

            .magic-btn {
                width: 160px;
                height: 160px;
            }

            .btn-text {
                font-size: 26px;
            }

            .bottom-text {
                margin-top: 30px;
                font-size: clamp(16px, 3vw, 28px);
                text-align: center;
            }
        }

        @media (orientation: landscape) and (max-height: 350px) {
            .magic-btn {
                width: 110px;
                height: 110px;
            }

            .btn-text {
                font-size: 18px;
            }

            .main-title {
                font-size: clamp(16px, 4vw, 32px);
                margin-bottom: 15px;
            }

            .bottom-text {
                margin-top: 20px;
                font-size: clamp(14px, 2.5vw, 24px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">恩典第34屆沙龍聯展開幕禮</h1>
        <div class="btn-container" id="btnContainer">
            <button class="magic-btn" id="playBtn">
                <span class="btn-shine"></span>
                <span class="btn-glow"></span>
                <span class="btn-text">剪綵</span>
            </button>
        </div>

        <div class="bottom-text">請大家跟隨大會安排一同剪綵</div>

        <div class="video-overlay" id="videoOverlay">
            <button class="close-video-btn" id="closeVideoBtn">×</button>
            <div class="video-container">
                <video id="videoPlayer" muted playsinline controls>
                    <source src="open.mp4" type="video/mp4">
                </video>
                <button class="play-video-btn" id="playVideoBtn" style="display:none;">点击播放</button>
            </div>
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const videoOverlay = document.getElementById('videoOverlay');
        const videoPlayer = document.getElementById('videoPlayer');
        const closeVideoBtn = document.getElementById('closeVideoBtn');
        const playVideoBtn = document.getElementById('playVideoBtn');
        let videoReady = false;

        videoPlayer.addEventListener('loadedmetadata', function() {
            console.log('视频元数据加载完成');
            videoReady = true;
        });

        videoPlayer.addEventListener('error', function(e) {
            console.error('视频加载错误:', e);
            alert('视频文件加载失败，请检查文件是否存在');
        });

        videoPlayer.load();

        playBtn.addEventListener('click', function(e) {
            createParticles(e);
            createSparkles(e);

            setTimeout(() => {
                videoOverlay.classList.add('active');
                playVideoBtn.style.display = 'none';
                
                if (videoReady) {
                    videoPlayer.play().then(() => {
                        console.log('视频播放成功');
                    }).catch(err => {
                        console.error('视频播放失败:', err);
                        playVideoBtn.style.display = 'block';
                    });
                } else {
                    console.log('视频尚未加载完成，等待加载...');
                    videoPlayer.addEventListener('loadedmetadata', function playWhenReady() {
                        videoPlayer.removeEventListener('loadedmetadata', playWhenReady);
                        videoPlayer.play().catch(err => {
                            console.error('视频播放失败:', err);
                            playVideoBtn.style.display = 'block';
                        });
                    });
                }
            }, 300);
        });

        playVideoBtn.addEventListener('click', function() {
            videoPlayer.play().then(() => {
                playVideoBtn.style.display = 'none';
                console.log('视频播放成功');
            }).catch(err => {
                console.error('视频播放失败:', err);
                alert('无法播放视频，请检查网络或视频文件');
            });
        });

        function createParticles(e) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const angle = (i / particleCount) * 360;
                const distance = 80 + Math.random() * 60;
                const tx = Math.cos(angle * Math.PI / 180) * distance;
                const ty = Math.sin(angle * Math.PI / 180) * distance;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                const btnParticles = document.createElement('div');
                btnParticles.className = 'btn-particles';
                btnParticles.appendChild(particle);
                playBtn.appendChild(btnParticles);
                setTimeout(() => btnParticles.remove(), 800);
            }
        }

        function createSparkles(e) {
            const sparkleChars = ['✨', '⭐', '🌟', '💫'];
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
                    sparkle.style.left = (e.clientX + (Math.random() - 0.5) * 100) + 'px';
                    sparkle.style.top = (e.clientY + (Math.random() - 0.5) * 100) + 'px';
                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 1000);
                }, i * 50);
            }
        }

        playBtn.addEventListener('click', function(e) {
            createParticles(e);
            createSparkles(e);

            setTimeout(() => {
                videoOverlay.classList.add('active');
                videoPlayer.play().then(() => {
                    console.log('视频播放成功');
                }).catch(err => {
                    console.error('视频播放失败:', err);
                    alert('视频播放失败，请检查网络或视频文件');
                    videoOverlay.classList.remove('active');
                });
            }, 300);
        });

        closeVideoBtn.addEventListener('click', function() {
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            videoOverlay.classList.remove('active');
        });

        videoPlayer.addEventListener('ended', function() {
            videoOverlay.classList.remove('active');
        });

        playBtn.addEventListener('mousedown', function(e) {
            this.style.transform = 'translateY(3px) scale(0.95)';
        });

        playBtn.addEventListener('mouseup', function() {
            this.style.transform = '';
        });

        playBtn.addEventListener('mouseleave', function() {
            this.style.transform = '';
        });
    </script>
</body>
</html>
